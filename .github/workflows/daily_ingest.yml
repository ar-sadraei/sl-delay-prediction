name: Daily SL Delay Ingestion

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install 7-zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install Python dependencies
        run: pip install -r .github/requirements-ingest.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run ingestion
        env:
          TRAFIKLAB_KODA_KEY: ${{ secrets.TRAFIKLAB_KODA_KEY }}
          BQ_TABLE: 'regal-stone-429421-j0.sl_delays.daily_all_routes'
        run: python src/daily_ingest.py

      - name: Backfill route types for any new dates
        env:
          TRAFIKLAB_KODA_KEY: ${{ secrets.TRAFIKLAB_KODA_KEY }}
        run: python src/backfill_route_types.py